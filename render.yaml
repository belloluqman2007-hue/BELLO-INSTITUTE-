# ============================================================================
# MULTI-MADRASA PLATFORM — NEW Render service definition
# ----------------------------------------------------------------------------
# This file describes a BRAND-NEW service. It does not reference, import, or
# attach to any existing/old deployment. Provision it as a new service in a
# new Render team/project and fill in the sync:false values with NEW values.
# No live secrets are stored in this file.
# ============================================================================
services:
  - type: web
    name: multi-madrasa-platform
    runtime: node
    # The Node runtime is pinned with NODE_VERSION below and .node-version.
    # `nodeVersion` is not a valid Render Blueprint field; keeping version
    # selection in supported settings is what lets Render apply the disk and
    # environment declarations in this file.
    plan: starter
    # A service with a persistent disk must remain a single instance.
    numInstances: 1
    # EU region = lowest latency to Nigeria; change freely.
    region: frankfurt
    # Do not auto-deploy main; deploy deliberately from this branch.
    autoDeploy: false
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    # ---------------------------------------------------------------------
    # PERSISTENT DISK — do not remove this block.
    # Render's container filesystem is thrown away on every deploy/restart.
    # Without a disk, uploads and JSON backups disappear, and if this service
    # is ever run on SQLite (no DATABASE_URL) the WHOLE database — every
    # madrasa included — is deleted on the next deploy. That is the exact
    # "I added a madrasa and later it was gone" report. A disk also allows
    # only ONE instance and no zero-downtime deploys: both are fine here.
    # Growing a disk is possible, shrinking is not. docs/PERSISTENCE.md.
    # ---------------------------------------------------------------------
    disk:
      name: bello-data
      mountPath: /var/data
      sizeGB: 1          # grow this later; Render minimum is 1
    # The database itself is the external MySQL (below); the disk holds
    # uploads, backups and the storage state marker.
    envVars:
      # Render's supported way to select Node. Keep this aligned with
      # .node-version and package.json; Node 22 provides node:sqlite for the
      # supported local/demo SQLite mode.
      - key: NODE_VERSION
        value: "22.22.3"
      - key: NODE_ENV
        value: production
      - key: DATABASE_DRIVER
        value: mysql
      # NEW database — create a fresh MySQL DB (see docs/DATABASE.md).
      # Never paste the old production connection string here.
      - key: DATABASE_URL
        sync: false
      # Auto-generated long secret for session signing + CSRF.
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPER_ADMIN_USERNAME
        value: admin
      # Set in dashboard; strong, unique, NEW.
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      # New service URL (set after creation, or use Render's assigned URL).
      - key: PUBLIC_URL
        sync: false
      - key: SESSION_MAX_AGE_HOURS
        value: "12"
      - key: LOGIN_RATE_LIMIT
        value: "10"
      - key: API_RATE_LIMIT
        value: "300"
      # Everything the app writes to disk lives on the volume above.
      - key: DATA_DIR
        value: /var/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: PERSISTENT_VOLUME_DIR
        value: /var/data
      # JSON snapshot of the whole database, every 6 hours, keeping 10.
      # 0 disables the timer; `npm run backup` writes one on demand.
      - key: BACKUP_INTERVAL_MINUTES
        value: "360"
      - key: BACKUP_KEEP
        value: "10"
      # A boot that finds a completely EMPTY database (the host threw the
      # container filesystem away, or the app was pointed at another file)
      # restores the newest snapshot before seeding, so tenants created days
      # ago come back by themselves. Keep it on; 0 disables it.
      - key: AUTO_RESTORE_ON_EMPTY_DB
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "5"
      # Logged-out (public site) traffic gets its own buckets.
      - key: PUBLIC_RATE_LIMIT
        value: "600"
      - key: PUBLIC_APPLY_LIMIT
        value: "8"
      - key: PUBLIC_VERIFY_LIMIT
        value: "12"
